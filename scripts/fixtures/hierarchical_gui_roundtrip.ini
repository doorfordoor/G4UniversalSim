# Small backend fixture for GUI hierarchical vis/cut round-trip.
[world]
shape = box
size = 10 cm, 10 cm, 10 cm
material = G4_AIR
vis.color = white
vis.alpha = 0.05
vis.visible = true
vis.wireframe = true

[volume.Detector]
parent = world
shape = box
size = 1 cm, 1 cm, 1 cm
material = G4_Si
region = DetectorRegion
cut.gamma = 0.5 mm
cut.e- = 50 um
vis.color = lime
vis.alpha = 0.7
vis.visible = true
vis.wireframe = false
