# ROOT output check: dose + fluence + edep with format = both, so every ROOT
# object can be cross-checked against the CSV of the same run
# (scripts/compare_root_csv.py).

[run]
name = root_output_check
threads = 2
seed = 4242

[output]
dir = test/output/root_ini
format = both

[materials]
file = config/materials/material.ini

[geometry]
template = simple_box
config = config/geometry/hit_smoke_box.ini

[physics]
reference = FTFP_BERT_EMZ
default_cut = 10 um

[source]
particle = e-
energy = 2 MeV
position_type = point
position = 0,0,-9 mm
direction = 0,0,1

[scoring]
enabled = true
hits = true
event_edep = true
edep = true
dose = true
fluence = true
auto_create_default_scorers = true

[scoring.edep]
bins = 50
min = 0 MeV
max = 2.5 MeV
