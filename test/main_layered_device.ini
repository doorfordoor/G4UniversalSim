[run]
name = test_layered_device_full
threads = 1
seed = 24680
interactive = false
verbose = 1
check_overlaps = true
dry_run = false

[output]
dir = test/output/layered_device

[materials]
file = test/materials/test_materials.ini

[geometry]
template = layered_device
config = test/geometry/layered_device_test.ini
check_overlaps = true
default_world_material = world

[physics]
reference = FTFP_BERT_EMZ
default_cut = 1 mm
biasing = true
verbose = 1

[physics.cuts]
gamma = 1 mm
e- = 100 nm
e+ = 100 nm
proton = 10 um

[physics.region.SV]
gamma = 1 mm
e- = 100 nm
e+ = 100 nm
proton = 10 um

[source]
preset = proton_beam
particle = proton
energy = 10 MeV
position_type = plane
radius = 2 mm
center = 0,0,-20 mm
direction = +z
verbose = 1

[scoring]
enabled = true
hits = true
event_edep = true
edep = true
# LET/Dose/Fluence scorers are currently stubs/no-op placeholders.
# Keep them disabled in runnable safety tests so the output is not mistaken
# for validated physical LET, dose, or fluence.
let = false
dose = false
fluence = false
auto_create_default_scorers = true
verbose = 1

[scoring.edep]
raw_histogram = true
weighted_histogram = true
bins = 100
min = 0 eV
max = 10 MeV
volume_summary = true
particle_summary = true

[biasing]
enabled = true

[biasing.xs]
particles = proton
processes = protonInelastic
factor = 5.0
volumes = Sensor, Metal
only_primary = true
apply_to_secondaries = false
min_weight = 0.05
max_interactions = 5
