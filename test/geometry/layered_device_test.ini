# LayeredDeviceTemplate configuration.
# Supported fields are defined in src/Templates/LayeredDeviceTemplate.cc.

[world]
size = 20 cm, 20 cm, 20 cm
material = world

[layers]
count = 4
names = Substrate, Sensor, Metal, Shield
auto_stack = true
axis = z
gap = 25 um

[layer.Substrate]
thickness = 500 um
xy = 12 mm, 12 mm
material = silicon
sensitive = false
bias = false
region = SubstrateRegion
cut.e- = 1 um
vis.color = gray
vis.alpha = 0.35
vis.visible = true
vis.wireframe = false

[layer.Sensor]
thickness = 100 um
xy = 10 mm, 10 mm
material = silicon
sensitive = true
bias = true
region = SV
cut.gamma = 1 mm
cut.e- = 100 nm
cut.e+ = 100 nm
cut.proton = 10 um
vis.color = cyan
vis.alpha = 0.65
vis.visible = true
vis.wireframe = false

[layer.Metal]
thickness = 50 um
xy = 10 mm, 10 mm
material = copper
sensitive = false
bias = true
region = MetalRegion
vis.color = yellow
vis.alpha = 0.55
vis.visible = true
vis.wireframe = false

[layer.Shield]
thickness = 200 um
xy = 14 mm, 14 mm
material = aluminum
sensitive = false
bias = false
region = ShieldRegion
vis.color = blue
vis.alpha = 0.25
vis.visible = true
vis.wireframe = true
