# -------------------- 梯形铁支架（TRD形状） --------------------
# 放置在主腔体底部，支撑靶区
[volume.iron_stand]
parent = main_chamber
shape = trd
dx1 = 8 cm       # 下底面 x 半长
dx2 = 10 cm      # 上底面 x 半长
dy1 = 8 cm       # 下底面 y 半长
dy2 = 10 cm      # 上底面 y 半长
dz = 2 cm        # z 方向半长
material = iron
position = 0 cm, 0 cm, -18 cm    # 置于腔体底部
rotation = 0 deg, 0 deg, 0 deg
vis.color = brown
vis.alpha = 0.60
vis.visible = true
vis.wireframe = false

# -------------------- 冷却水管（圆柱，穿过腔体） --------------------
[volume.cooling_pipe]
parent = main_chamber
shape = tubs
parameters = 0 cm, 0.8 cm, 20 cm, 0 deg, 360 deg
material = water
position = 9 cm, 15 cm, 0 cm
rotation = 0 deg, 45 deg, 0 deg    # 倾斜45度增加复杂性
vis.color = aqua
vis.alpha = 0.50
vis.visible = true
vis.wireframe = false
