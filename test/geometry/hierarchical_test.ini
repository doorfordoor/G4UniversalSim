# ============================================================
# 复杂实验装置几何模型 (hierarchical 模板)
# 包含：球形靶、圆柱屏蔽层、双层探测器环、梯形支架、冷却管
# ============================================================

# -------------------- 世界体积 --------------------
[world]
shape = box
size = 80 cm, 80 cm, 80 cm
material = G4_AIR
vis.color = white
vis.alpha = 0.05
vis.visible = true
vis.wireframe = true

# -------------------- 主腔体（铝） --------------------
[volume.main_chamber]
parent = world
shape = box
size = 50 cm, 50 cm, 50 cm
material = G4_Al
position = 0 mm, 0 mm, 0 mm
rotation = 0 deg, 0 deg, 0 deg
vis.color = gray
vis.alpha = 0.10
vis.visible = true
vis.wireframe = true

# -------------------- 中心球形铅靶 --------------------
[volume.target_sphere]
parent = main_chamber
shape = sphere
parameters = 0 mm, 2 cm, 0 deg, 360 deg, 0 deg, 180 deg
material = G4_Pb
position = 0 mm, 0 mm, 0 mm
vis.color = red
vis.alpha = 0.70
vis.visible = true
vis.wireframe = false
# 靶本身不设为敏感，但可用于能量沉积 scoring

# -------------------- 内层水慢化层（圆柱） --------------------
[volume.water_moderator]
parent = main_chamber
shape = tubs
parameters = 2.1 cm, 3.5 cm, 5 cm, 0 deg, 360 deg
material = G4_WATER
position = 0 mm, 0 mm, 0 mm
vis.color = blue
vis.alpha = 0.30
vis.visible = true
vis.wireframe = false

# -------------------- 外层铅屏蔽层（圆柱） --------------------
[volume.lead_shield]
parent = main_chamber
shape = tubs
parameters = 3.6 cm, 5 cm, 6 cm, 0 deg, 360 deg
material = G4_Pb
position = 0 mm, 0 mm, 0 mm
bias = true
region = ShieldRegion
vis.color = darkgray
vis.alpha = 0.50
vis.visible = true
vis.wireframe = false

# -------------------- 内层探测器环（4个） --------------------
# 探测器1: +X方向
[volume.inner_detector_x]
parent = main_chamber
shape = box
size = 2.5 cm, 2.5 cm, 0.4 cm
material = silicon
position = 7 cm, 0 cm, 0 cm
rotation = 0 deg, 0 deg, 0 deg
sensitive = true
region = InnerDetRegion
cut.gamma = 0.5 mm
cut.e- = 50 um
cut.e+ = 50 um
copyNo = 101
vis.color = cyan
vis.alpha = 0.80
vis.visible = true
vis.wireframe = false

# 探测器2: -X方向
[volume.inner_detector_nx]
parent = main_chamber
shape = box
size = 2.5 cm, 2.5 cm, 0.4 cm
material = silicon
position = -7 cm, 0 cm, 0 cm
rotation = 0 deg, 0 deg, 0 deg
sensitive = true
region = InnerDetRegion
cut.gamma = 0.5 mm
cut.e- = 50 um
cut.e+ = 50 um
copyNo = 102
vis.color = cyan
vis.alpha = 0.80
vis.visible = true
vis.wireframe = false

# 探测器3: +Y方向
[volume.inner_detector_y]
parent = main_chamber
shape = box
size = 2.5 cm, 2.5 cm, 0.4 cm
material = silicon
position = 0 cm, 7 cm, 0 cm
rotation = 0 deg, 0 deg, 0 deg
sensitive = true
region = InnerDetRegion
cut.gamma = 0.5 mm
cut.e- = 50 um
cut.e+ = 50 um
copyNo = 103
vis.color = cyan
vis.alpha = 0.80
vis.visible = true
vis.wireframe = false

# 探测器4: -Y方向
[volume.inner_detector_ny]
parent = main_chamber
shape = box
size = 2.5 cm, 2.5 cm, 0.4 cm
material = silicon
position = 0 cm, -7 cm, 0 cm
rotation = 0 deg, 0 deg, 0 deg
sensitive = true
region = InnerDetRegion
cut.gamma = 0.5 mm
cut.e- = 50 um
cut.e+ = 50 um
copyNo = 104
vis.color = cyan
vis.alpha = 0.80
vis.visible = true
vis.wireframe = false

# -------------------- 外层探测器环（4个，更大尺寸） --------------------
# 探测器5: +X 方向外圈
[volume.outer_detector_x]
