[run]
name = test_hierarchical_full
threads = 1
seed = 13579
interactive = false
verbose = 1
check_overlaps = true
dry_run = false

[output]
dir = test/output/hierarchical

[materials]
file = test/materials/test_materials.ini

[geometry]
template = hierarchical
config = test/geometry/hierarchical_test.ini
check_overlaps = true
default_world_material = air

[physics]
reference = FTFP_BERT_EMZ
default_cut = 1 mm
biasing = true
verbose = 1

[physics.cuts]
gamma = 1 mm
e- = 100 nm
e+ = 100 nm
proton = 10 um

[physics.region.SV]
gamma = 1 mm
e- = 100 nm
e+ = 100 nm
proton = 10 um

[source]
preset = plane_proton_beam
particle = proton
energy = 15 MeV
position_type = plane
radius = 3 mm
center = 0,0,-30 mm
direction = +z
verbose = 1

[scoring]
enabled = true
hits = true
event_edep = true
edep = true
let = true
dose = true
fluence = true
auto_create_default_scorers = true
verbose = 1

[scoring.edep]
raw_histogram = true
weighted_histogram = true
bins = 120
min = 0 eV
max = 15 MeV
volume_summary = true
particle_summary = true

[biasing]
enabled = true

[biasing.xs]
particles = proton, neutron
processes = protonInelastic, neutronInelastic
factor = 3.0
volumes = sensor_1, shield
only_primary = false
apply_to_secondaries = true
min_weight = 0.02
max_interactions = 8
