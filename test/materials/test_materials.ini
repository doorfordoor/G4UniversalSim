# Material aliases for end-to-end tests.
# Parsed by MaterialIniReader. The legacy alias format [Alias] material = G4_* is supported.

[world]
material = G4_AIR

[air]
material = G4_AIR

[silicon]
material = G4_Si

[copper]
material = G4_Cu

[aluminum]
material = G4_Al

[lead]
material = G4_Pb

[water]
material = G4_WATER

[element.TestCarbon]
symbol = C
z = 6
a = 12.011 g/mole

[material.test_polymer]
density = 1.05 g/cm3
mode = atom_count
components = TestCarbon:2
state = solid
