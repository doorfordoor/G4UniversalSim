; H2-3 minimal example: a mono-energetic photon beam through a thin
; G4_Galactic slab, recording the per-volume kinetic-energy fluence spectrum.
;
; Run from this directory:
;   G4UniversalSim --config main.ini --macro run.mac --output output
;
; Expected (100 events, 0.1 mm / 10 mm^3 per event): the spectrum holds
; 1.0 mm^-2 in bin 5 of [0.5, 1.5) MeV (10 bins), with empty underflow and
; overflow rows, and run_summary.txt reports spectrum_csv_schema_version = 1.

[run]
name = h2_volume_spectrum
threads = 1
seed = 20261305
interactive = false
verbose = 0
check_overlaps = false
dry_run = false

[output]
dir = output
format = csv

[geometry]
template = hierarchical
config = geometry.ini
default_world_material = G4_Galactic

[physics]
em = option4
default_cut = 0.1 mm

[scoring]
enabled = true
hits = false
event_edep = false
edep = false
dose = false
fluence = true
auto_create_default_scorers = true

[scoring.spectrum.fluence]
bins = 10
min = 0.5 MeV
max = 1.5 MeV

[source]
particle = gamma
energy = 1 MeV
position_type = plane
shape = square
halfx = 4 mm
center = 0, 0, -2 mm
direction = 0, 0, 1
