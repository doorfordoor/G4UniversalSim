; H3-3 parallel scoring world, box example.
; Run from this directory:
;   G4UniversalSim --config main.ini --macro run.mac --output output

[run]
name = parallel_world_box
threads = 1
seed = 20261400
interactive = false
verbose = 0
check_overlaps = true
dry_run = false

[output]
dir = output
format = csv

[materials]
file = materials.ini

[geometry]
template = hierarchical
config = geometry.ini
check_overlaps = true
default_world_material = galactic

[physics]
reference = FTFP_BERT
default_cut = 0.1 mm

[scoring]
enabled = true
hits = false
event_edep = false
edep = false
dose = true
fluence = true
auto_create_default_scorers = true

[source]
particle = proton
energy = 10 MeV
position_type = point
position = 0, 0, -20 mm
direction = 0, 0, 1

; The same box is declared once in the mass geometry (not sensitive) and once in
; the parallel geometry (sensitive). Only the parallel declaration scores.
[parallel_world]
enabled = true
name = ScoringWorld
geometry_config = parallel.ini
