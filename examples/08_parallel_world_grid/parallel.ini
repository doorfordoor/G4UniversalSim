; Parallel scoring geometry: a 4 x 4 x 1 grid of 16 cells over the slab.
; Cell size 5 x 5 x 2 mm, 50 mm^3 and 5e-05 kg of water per cell.
[world]
material = G4_Galactic

[grid.SlabGrid]
parent = world
size = 20 mm, 20 mm, 2 mm
position = 0 mm, 0 mm, 0 mm
material = water
bins = 4, 4, 1
sensitive = true
