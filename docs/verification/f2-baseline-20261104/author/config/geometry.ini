# Baseline geometry for the F2 controlled-session evidence run.
# The world is vacuum (G4_Galactic) so the primary reaches the target with the
# sampled source energy; Target is the only sensitive volume and the phase
# space recorder entry volume.
[world]
shape = box
size = 200 mm,200 mm,200 mm
material = G4_Galactic

[volume.Target]
parent = world
shape = box
size = 20 mm,20 mm,20 mm
material = G4_WATER
sensitive = true
