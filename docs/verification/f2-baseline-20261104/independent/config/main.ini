# F2 controlled-session baseline: one monochromatic point source in vacuum.
# With this main INI, `/AIHL/source/*` commands are single-field setters on the
# one configured source (see src/Source/SourceManager.cc).
[run]
threads = 1
seed = 1904

[output]
format = csv

[geometry]
template = hierarchical
config = geometry.ini
check_overlaps = true

[physics]
reference = FTFP_BERT_EMZ
default_cut = 1 mm

[scoring]
enabled = true
hits = true
event_edep = true
auto_create_default_scorers = true

# The recorder writes one phase_space row for every track that steps into
# Target_PV, so each row is the kernel-consumed primary vertex for that event.
[phase_space]
volume = Target_PV
particles = all
kill = false

[source]
particle = proton
energy = 100 MeV
position = 0,0,-50 mm
direction = 0,0,1
