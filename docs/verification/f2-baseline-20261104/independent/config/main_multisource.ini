# Counterexample configuration: two named sources in one file.
# `/AIHL/source/*` single-field commands must be rejected here because they
# cannot choose one of several sources (SourceManager::RequireSingleSourceForCommand).
[run]
threads = 1
seed = 1904

[output]
format = csv

[geometry]
template = hierarchical
config = geometry.ini
check_overlaps = true

[physics]
reference = FTFP_BERT_EMZ
default_cut = 1 mm

[scoring]
enabled = true
hits = true
event_edep = true
auto_create_default_scorers = true

[source]
verbose = 0

[source.protons]
particle = proton
energy = 100 MeV
intensity = 1
position = 0,0,-50 mm
direction = 0,0,1

[source.electrons]
particle = e-
energy = 50 MeV
intensity = 1
position = 5,0,-50 mm
direction = 0,0,1
