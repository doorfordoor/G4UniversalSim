; Q2-5 biasing versus analog: one 1 cm lead cube is the only sensitive volume.
; The world is Galactic so the only material seen by the primary is G4_Pb.
[world]
shape = box
size = 100 mm, 100 mm, 100 mm
material = G4_Galactic

[volume.Target]
parent = world
shape = box
size = 10 mm, 10 mm, 10 mm
material = G4_Pb
sensitive = true
bias = true
