; Q2-5: 10 MeV electrons on a 1 cm lead cube.
; This file is identical between groups except the marked biasing lines.
[run]
name = q25_biasing_case
threads = 2
check_overlaps = false

[output]
format = csv

[geometry]
template = hierarchical
config = inputs/geometry.ini
default_world_material = G4_Galactic

[physics]
reference = FTFP_BERT
default_cut = 0.1 mm
biasing = true

[scoring]
enabled = true
hits = true
event_edep = true
edep = false
dose = true
let = false
fluence = false
auto_create_default_scorers = true

[source]
particle = e-
energy = 10 MeV
position_type = point
position = 0, 0, 0 mm
direction = 0, 0, 1

; The only biasing rule: enhance bremsstrahlung on the primary electron inside
; Target. The generic-biasing operation proposes a cross-section change; the
; weight the kernel assigns to a track is a transport outcome, not something
; inferred from the cross-section ratio. Observed weights must come from the
; run's own hits/phase-space evidence and worker receipts.
[biasing]
enabled = true

[biasing.xs.e-.eBrem]
factor = 1.2
volumes = Target
only_primary = true
apply_to_secondaries = false
min_weight = 0.05
max_interactions = 2

[physics.region.DiagnosticTarget]
volumes = Target
max_step = 0.01 mm
