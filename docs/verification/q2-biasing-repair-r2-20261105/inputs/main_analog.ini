; Q2-5: 10 MeV electrons on a 1 cm lead cube.
; This file is identical between groups except the marked biasing lines.
[run]
name = q25_biasing_case
threads = 2
check_overlaps = false

[output]
format = csv

[geometry]
template = hierarchical
config = inputs/geometry.ini
default_world_material = G4_Galactic

[physics]
reference = FTFP_BERT
default_cut = 0.1 mm
biasing = false

[scoring]
enabled = true
hits = true
event_edep = true
edep = false
dose = true
let = false
fluence = false
auto_create_default_scorers = true

[source]
particle = e-
energy = 10 MeV
position_type = point
position = 0, 0, 0 mm
direction = 0, 0, 1

[physics.region.DiagnosticTarget]
volumes = Target
max_step = 0.01 mm
