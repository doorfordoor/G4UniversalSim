# Narrow-beam attenuation benchmark: 1 MeV photons through 10 cm of water.
# Run from the repository root. The full comparison is scripts/run_benchmarks.py.
[run]
threads = 4
macro = scenarios/benchmarks/gamma_attenuation/run.mac
[output]
dir = output/benchmark_gamma_attenuation
format = csv
[materials]
file = config/materials/material.ini
[geometry]
template = hierarchical
config = scenarios/benchmarks/gamma_attenuation/geometry.ini
[physics]
reference = FTFP_BERT_EMZ
default_cut = 0.7 mm
[scoring]
enabled = true
hits = false
event_edep = false
edep = false
[source]
particle = gamma
energy = 1 MeV
position_type = point
position = 0,0,-100 mm
direction = +z
[phase_space]
volume = Plane_PV
particles = gamma
kill = true
