# Bragg peak benchmark: 150 MeV proton pencil beam, depth-energy deposit in water.
# Run from the repository root. The full comparison is scripts/run_benchmarks.py.
[run]
threads = 4
macro = scenarios/benchmarks/bragg_peak/run.mac
[output]
dir = output/benchmark_bragg_peak
format = csv
[materials]
file = config/materials/material.ini
[geometry]
template = hierarchical
config = scenarios/benchmarks/bragg_peak/geometry.ini
[physics]
reference = QGSP_BIC_EMZ
default_cut = 0.7 mm
[scoring]
enabled = true
hits = false
event_edep = false
edep = false
[source]
particle = proton
energy = 150 MeV
position_type = point
position = 0,0,-10 mm
direction = +z
[scoring.mesh.depth]
shape = box
size = 100 mm, 100 mm, 150 mm
bins = 1, 1, 300
center = 0 mm, 0 mm, 150 mm
[scoring.mesh.depth.edep]
type = energyDeposit
unit = MeV
