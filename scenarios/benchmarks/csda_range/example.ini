# CSDA range benchmark: 100 MeV protons stopping in water (EM-only physics).
# Run from the repository root. The full comparison is scripts/run_benchmarks.py.
[run]
threads = 4
macro = scenarios/benchmarks/csda_range/run.mac
[output]
dir = output/benchmark_csda_range
format = csv
[materials]
file = config/materials/material.ini
[geometry]
template = hierarchical
config = scenarios/benchmarks/csda_range/geometry.ini
[physics]
em = option4
default_cut = 0.7 mm
[scoring]
enabled = true
hits = true
event_edep = false
edep = false
[source]
particle = proton
energy = 100 MeV
position_type = point
position = 0,0,0 mm
direction = +z
