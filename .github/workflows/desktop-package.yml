name: I2 desktop package delivery

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frozen-desktop:
    name: ${{ matrix.os }} / frozen desktop and ROOT helper
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - name: Enable long paths in the Windows checkout
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Linux desktop runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0 xvfb xauth patchelf fonts-noto-cjk
      - name: Install the product Python dependencies and packaging tools
        run: python -m pip install -r gui/requirements.txt -r gui/requirements-3d.txt pyinstaller
      - name: Diagnose the actual Linux xcb dependencies
        if: runner.os == 'Linux'
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import PySide6
          root = Path(PySide6.__file__).parent / 'Qt'
          outputs = []
          failed = False
          for relative in ('plugins/platforms/libqxcb.so', 'lib/libQt6XcbQpa.so.6'):
              result = subprocess.run(['ldd', str(root / relative)], capture_output=True)
              outputs.append(relative.encode() + b'\n' + result.stdout + result.stderr)
              failed |= result.returncode != 0 or b'not found' in result.stdout + result.stderr
          path = Path('out/xcb-runtime-dependencies.log')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(b'\n'.join(outputs))
          print(path.read_text())
          assert not failed, 'xcb native dependencies are incomplete; see retained ldd evidence'
          PY
      - name: Build and test real frozen applications
        run: python -B tools/test_assert_probe.py scripts/test_frozen_desktop.py --directory out/frozen-desktop-ci
      - name: Linux real VTK actor checks
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python -B tools/test_assert_probe.py gui/smoke_tests/smoke_j1_appearance.py --renderer
      - name: Retain delivery receipts and build failure diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frozen-desktop-${{ runner.os }}
          path: |
            out/xcb-runtime-dependencies.log
            out/frozen-desktop-ci/*.json
            out/frozen-desktop-ci/*.log
            out/frozen-desktop-ci/*-build/freeze.log
            out/frozen-desktop-ci/*-build/binary-sources.json
            out/frozen-desktop-ci/*-build/source-identity.json
          if-no-files-found: error
