name: I2 native runtime and SDK installation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  installation:
    name: ${{ matrix.os }} / Geant4 11.4.3 installation
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Enable long paths in the Windows checkout
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Linux desktop and build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0 patchelf fonts-noto-cjk
      - name: Free unused hosted Android SDK before installation acceptance
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          sdk_root=/usr/local/lib/android/sdk
          removed=false
          # $RUNNER_TEMP is the filesystem that holds the installation workspace.
          before_bytes=$(df -B1 --output=avail "$RUNNER_TEMP" | tail -n 1 | tr -d ' ')
          echo "disk-before-available-bytes: ${before_bytes}"
          if [ -d "${sdk_root}" ] && [ ! -L "${sdk_root}" ]; then
            sudo rm -rf "${sdk_root}"
            removed=true
            echo "Removed the GitHub-hosted Linux preinstalled Android SDK at ${sdk_root}; no other tools are enumerated or removed."
          else
            echo "No GitHub-hosted Linux preinstalled Android SDK at ${sdk_root}; nothing removed."
          fi
          after_bytes=$(df -B1 --output=avail "$RUNNER_TEMP" | tail -n 1 | tr -d ' ')
          echo "disk-after-available-bytes: ${after_bytes}"
          freed_bytes=$((after_bytes - before_bytes))
          echo "disk-freed-bytes: ${freed_bytes}"
          # Step summary is the durable record for this cleanup step.
          {
            echo '### Hosted Linux disk space before installation acceptance'
            echo "- filesystem_probe_path: ${RUNNER_TEMP} (installation workspace)"
            echo "- before_available_bytes: ${before_bytes}"
            echo "- after_available_bytes: ${after_bytes}"
            echo "- freed_bytes: ${freed_bytes}"
            echo "- removed_fixed_directory: ${sdk_root}"
            echo "- removed: ${removed}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install isolated packaging dependencies
        run: python -m pip install -r gui/requirements.txt -r gui/requirements-3d.txt pyinstaller
      - name: Prepare Linux Geant4 SDK and its actual datasets
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          delivery="$RUNNER_TEMP/g4usim-delivery"
          mkdir -p "$delivery/bootstrap"
          curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xj -C "$delivery/bootstrap" bin/micromamba
          prefix="$delivery/bootstrap/geant4"
          "$delivery/bootstrap/bin/micromamba" create -y -p "$prefix" -c conda-forge 'geant4=11.4.3' 'python=3.11' expat zlib freetype
          "$delivery/bootstrap/bin/micromamba" run -p "$prefix" -- printenv | grep -E '^(G4[A-Z0-9_]*DATA|GEANT4[A-Z0-9_]*)=' >> "$GITHUB_ENV"
          echo "G4_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "G4_BUILD=$delivery/backend" >> "$GITHUB_ENV"
          echo "DELIVERY_ROOT=$delivery" >> "$GITHUB_ENV"
      - name: Configure and compile Linux backend
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B "$G4_BUILD" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$G4_PREFIX" \
            -DEXPAT_INCLUDE_DIR="$G4_PREFIX/include" -DEXPAT_LIBRARY="$G4_PREFIX/lib/libexpat.so" \
            -DZLIB_INCLUDE_DIR="$G4_PREFIX/include" -DZLIB_LIBRARY="$G4_PREFIX/lib/libz.so" \
            -DFREETYPE_INCLUDE_DIRS="$G4_PREFIX/include/freetype2" -DFREETYPE_LIBRARY="$G4_PREFIX/lib/libfreetype.so"
          cmake --build "$G4_BUILD" --parallel 4
          "$G4_BUILD/G4UniversalSim" --check-geant4-data > "$DELIVERY_ROOT/discovery.json"
      - name: Prepare hash-verified official Windows SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $delivery = Join-Path $env:RUNNER_TEMP 'g4usim-delivery'
          $bootstrap = Join-Path $delivery 'bootstrap'
          New-Item -ItemType Directory -Path $bootstrap | Out-Null
          $archive = Join-Path $bootstrap 'geant4-11.4.3-official.zip'
          Invoke-WebRequest 'https://geant4-data.web.cern.ch/releases/lib4.11.4.p03/WIN64-VC17.14.41-11.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b0725c4e34d4714c5ccf0f575b4bccfb06c021fc19f3696f347bb7ea464e4d9c') { throw 'Official SDK archive identity mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $bootstrap 'sdk')
          $configs = @(Get-ChildItem -LiteralPath (Join-Path $bootstrap 'sdk') -Filter Geant4Config.cmake -Recurse -File)
          if ($configs.Count -ne 1) { throw 'Expected one Geant4 CMake configuration' }
          $prefix = $configs[0].Directory.Parent.Parent.Parent.FullName
          "G4_PREFIX=$prefix" >> $env:GITHUB_ENV
          "G4_BUILD=$(Join-Path $delivery 'backend')" >> $env:GITHUB_ENV
          "DELIVERY_ROOT=$delivery" >> $env:GITHUB_ENV
          (Join-Path $prefix 'bin') >> $env:GITHUB_PATH
          python packaging/ci_fetch_geant4_data.py --config $configs[0].FullName --directory (Join-Path $bootstrap 'datasets')
          if ($LASTEXITCODE -ne 0) { throw 'Dataset acquisition or verification failed' }
          "GEANT4_DATA_DIR=$(Join-Path $bootstrap 'datasets/data')" >> $env:GITHUB_ENV
      - name: Configure and compile Windows backend
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B $env:G4_BUILD "-DGeant4_DIR=$env:G4_PREFIX/lib/cmake/Geant4"
          if ($LASTEXITCODE -ne 0) { throw 'Backend configure failed' }
          cmake --build $env:G4_BUILD --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Backend compilation failed' }
          & "$env:G4_BUILD/Release/G4UniversalSim.exe" --check-geant4-data > "$env:DELIVERY_ROOT/discovery.json"
          if ($LASTEXITCODE -ne 0) { throw 'Actual backend dataset discovery failed' }
      - name: Linux full runtime and SDK installation lifecycle
        if: runner.os == 'Linux'
        run: |
          python -B tools/test_assert_probe.py packaging/ci_delivery.py --build-dir "$G4_BUILD" --geant4-prefix "$G4_PREFIX" \
            --discovery-json "$DELIVERY_ROOT/discovery.json" --work-root "$DELIVERY_ROOT/acceptance" \
            --cmake "$(command -v cmake)" --compiler "$(command -v c++)" --application-build
      - name: Windows full runtime and SDK installation lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -B tools/test_assert_probe.py packaging/ci_delivery.py --build-dir $env:G4_BUILD --geant4-prefix $env:G4_PREFIX --discovery-json "$env:DELIVERY_ROOT/discovery.json" --work-root "$env:DELIVERY_ROOT/acceptance" --cmake (Get-Command cmake).Source --application-build
          if ($LASTEXITCODE -ne 0) { throw 'Full installation lifecycle verification failed' }
      - name: Retain actual runner and installation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: full-installation-${{ runner.os }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/g4usim-delivery/acceptance/evidence/
            ${{ runner.temp }}/g4usim-delivery/acceptance/runtime-evidence/
            ${{ runner.temp }}/g4usim-delivery/acceptance/sdk-evidence/
            ${{ runner.temp }}/g4usim-delivery/acceptance/logs/
            ${{ runner.temp }}/g4usim-delivery/acceptance/*.json
            ${{ runner.temp }}/g4usim-delivery/acceptance/*.log
            ${{ runner.temp }}/g4usim-delivery/bootstrap/datasets/fetch-report.json
            ${{ runner.temp }}/g4usim-delivery/discovery.json
          if-no-files-found: error
