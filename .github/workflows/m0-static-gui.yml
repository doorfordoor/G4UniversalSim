name: M0 static and GUI regression

on:
  push:
  pull_request:

permissions:
  contents: read

# The GUI profile drives PySide6 widgets, so the runners have no display. Qt must
# be told to use the offscreen platform plugin; without it the historical runs
# failed inside "Run offscreen GUI tests" on both Ubuntu and Windows.
env:
  QT_QPA_PLATFORM: offscreen

jobs:
  no-geant4:
    name: ${{ matrix.os }} / Python 3.11
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      # PySide6 wheels dlopen libEGL/libGL/libxkbcommon when Qt initialises. The
      # runner images usually ship them, but pinning the minimum set keeps a runner
      # image change from turning into a silent GUI failure.
      - name: Install Linux GUI runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install GUI dependency
        run: python -m pip install -r gui/requirements.txt
      # --fail-on-skip: a missing Qt/uproot/backend must fail the job instead of
      # producing the distinct skip exit status that a green build used to hide.
      - name: Verify tracked source inventory and static tests
        run: python -B scripts/run_m0_tests.py --profile static --require-tracked-sources --fail-on-skip
      # A green job must leave a report whose per-case assertion counts, log digests
      # and fingerprints are self-consistent; validate each profile's own report
      # immediately, while it is still the newest one.
      - name: Validate static report evidence
        run: python -B scripts/check_report_evidence.py
      # Public repositories hide job logs behind a login, so a failing run must
      # carry the failing case and its log tail in the public annotations instead.
      - name: Annotate failing static cases
        if: failure()
        run: python -B scripts/ci_annotate_failures.py --report-root out/verification
      - name: Run offscreen GUI tests
        run: python -B scripts/run_m0_tests.py --profile gui --require-tracked-sources --fail-on-skip
      - name: Validate GUI report evidence
        run: python -B scripts/check_report_evidence.py
      - name: Annotate failing GUI cases
        if: failure()
        run: python -B scripts/ci_annotate_failures.py --report-root out/verification
      - name: Upload M0 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-report-${{ matrix.os }}
          path: out/verification
          if-no-files-found: warn
