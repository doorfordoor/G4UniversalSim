name: M0 static and GUI regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  no-geant4:
    name: ${{ matrix.os }} / Python 3.11
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install GUI dependency
        run: python -m pip install -r gui/requirements.txt
      - name: Verify tracked source inventory and static tests
        run: python -B scripts/run_m0_tests.py --profile static --require-tracked-sources
      - name: Run offscreen GUI tests
        run: python -B scripts/run_m0_tests.py --profile gui --require-tracked-sources
