# Main configuration file for G4UniversalSim

[run]
name = simple_test
threads = 1
seed = 12345
interactive = false
verbose = 1
check_overlaps = true

[output]
dir = output/simple_test

[materials]
file = config/materials/material.ini

[geometry]
template = simple_box
config = config/geometry/simple_box.ini
check_overlaps = true
default_world_material = G4_AIR

[physics]
reference = FTFP_BERT_EMZ
default_cut = 1 mm
biasing = false
verbose = 1

[source]
preset = proton_beam
particle = proton
energy = 10 MeV
position_type = point
position = 0,0,-1 mm
direction = 0,0,1

[scoring]
enabled = true
hits = true
event_edep = true
edep = true
let = false
dose = false
fluence = false
auto_create_default_scorers = true
verbose = 1

[scoring.edep]
raw_histogram = true
weighted_histogram = true
bins = 200
min = 0 eV
max = 10 MeV
volume_summary = true
particle_summary = true

[biasing]
enabled = false
