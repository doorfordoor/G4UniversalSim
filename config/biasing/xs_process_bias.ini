# Process-level XS biasing example.
# Copy these sections into config/main.ini or another main config loaded by
# SimulationManager. BiasingManager does not currently load this file directly.

[biasing]
enabled = true

[biasing.xs.proton.protonInelastic]
enabled = true
factor = 3.0
volumes = Target
only_primary = false
apply_to_secondaries = true
min_weight = 0.02
max_interactions = 8

[biasing.xs.neutron.neutronInelastic]
enabled = true
factor = 5.0
volumes = Target
only_primary = true
apply_to_secondaries = false
min_weight = 0.05
max_interactions = 5

