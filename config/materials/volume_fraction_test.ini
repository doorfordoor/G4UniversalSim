# volume_fraction material smoke-test configuration.
# The volume_fraction backend supports material components only.

[nist]
materials = G4_AIR, G4_WATER, G4_Si, G4_Pb, G4_SILICON_DIOXIDE

[material.SameDensityA]
density = 1.0 g/cm3
mode = atom_count
components = G4_C:1
state = solid

[material.SameDensityB]
density = 1.0 g/cm3
mode = atom_count
components = G4_H:2,G4_O:1
state = solid

[material.SameDensityMix]
mode = volume_fraction
density = auto
components = SameDensityA:0.25, SameDensityB:0.75
state = solid

[material.Epoxy]
density = 1.20 g/cm3
mode = mass_fraction
components = G4_C:0.60, G4_H:0.08, G4_O:0.32
state = solid

[material.EMC_Auto]
mode = volume_fraction
density = auto
components = G4_SILICON_DIOXIDE:0.85, Epoxy:0.15
state = solid

[material.EMC_Explicit]
mode = volume_fraction
density = 1.80 g/cm3
components = G4_SILICON_DIOXIDE:0.85, Epoxy:0.15
state = solid

[material.WaterLeadMix]
mode = volume_fraction
components = G4_WATER:0.25, G4_Pb:0.75
state = solid
