# Round 6C smoke geometry: final boolean target is sensitive.
# The subtraction tool is a solid operand only; it must not carry material,
# sensitive, bias, region, or cuts.

[world]
shape = box
size = 30 mm,30 mm,30 mm
material = G4_AIR

[volume.BooleanTarget]
parent = world
shape = box
size = 20 mm,20 mm,20 mm
position = 0 mm,0 mm,0 mm
material = G4_Si
sensitive = true
region = SV

[volume.BooleanTarget.boolean.0]
operation = subtraction
shape = tubs
parameters = 0 mm,2 mm,11 mm,0 deg,360 deg
position = 6 mm,0 mm,0 mm
rotation = 0 deg,0 deg,0 deg
name = center_hole
