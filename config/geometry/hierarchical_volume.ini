# HierarchicalVolumeTemplate geometry configuration.
# Parsed through GeometryConfig, so generic [world] and [volume.*] sections are used.

[world]
shape = box
size = 10 cm, 10 cm, 10 cm
material = G4_AIR

[volume.Container]
parent = world
shape = box
size = 5 cm, 5 cm, 5 cm
material = G4_WATER
position = 0 mm, 0 mm, 0 mm

[volume.Detector]
parent = Container
shape = box
size = 1 cm, 1 cm, 1 cm
material = G4_Si
position = 0 mm, 0 mm, 0 mm
sensitive = true
region = DetectorRegion
