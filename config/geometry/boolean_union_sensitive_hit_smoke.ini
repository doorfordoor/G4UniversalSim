# Round 6D smoke geometry: final boolean target is a union solid and sensitive.
# The union tool is a solid operand only; it must not carry material, sensitive,
# bias, region, or cuts.

[world]
shape = box
size = 40 mm,40 mm,40 mm
material = G4_AIR

[volume.BooleanTarget]
parent = world
shape = box
size = 10 mm,10 mm,10 mm
position = 0 mm,0 mm,0 mm
material = G4_Si
sensitive = true
bias = true
region = SV

[volume.BooleanTarget.boolean.0]
operation = union
shape = box
size = 8 mm,8 mm,8 mm
position = 6 mm,0 mm,0 mm
rotation = 0 deg,0 deg,0 deg
name = side_lobe
