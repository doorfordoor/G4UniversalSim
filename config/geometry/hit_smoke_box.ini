# Guaranteed-hit smoke geometry for SensitiveDetector/Scoring output.
# Uses only simple_box + G4Box; no GDML/STL/trap/volume_fraction.

[world]
size = 8 cm, 8 cm, 8 cm
material = G4_AIR

[target]
name = Target
shape = box
size = 20 mm, 20 mm, 20 mm
material = G4_Si
position = 0 mm, 0 mm, 0 mm
rotation = 0 deg, 0 deg, 0 deg
sensitive = true
bias = true
region = SV
cut.gamma = 1 um
cut.e- = 1 um
cut.e+ = 1 um
cut.proton = 1 um

[visual.world]
color = white
alpha = 0.05
visible = true
wireframe = true

[visual.target]
color = blue
alpha = 0.65
visible = true
wireframe = false
