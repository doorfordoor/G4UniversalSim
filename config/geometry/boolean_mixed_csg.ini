# Round 6D runnable mixed sequential CSG.
# Sequential semantics: (((base subtraction tool0) union tool1) intersection tool2).

[world]
shape = box
size = 50 mm,50 mm,50 mm
material = G4_AIR

[volume.Target]
parent = world
shape = box
size = 14 mm,12 mm,8 mm
position = 0 mm,0 mm,0 mm
material = G4_Si
sensitive = true
region = SV

[volume.Target.boolean.0]
operation = subtraction
shape = tubs
parameters = 0 mm,1.5 mm,5 mm,0 deg,360 deg
position = -3 mm,0 mm,0 mm
rotation = 0 deg,0 deg,0 deg
name = left_hole

[volume.Target.boolean.1]
operation = union
shape = box
size = 6 mm,8 mm,6 mm
position = 7 mm,0 mm,0 mm
rotation = 0 deg,0 deg,0 deg
name = side_extension

[volume.Target.boolean.2]
operation = intersection
shape = box
size = 20 mm,10 mm,10 mm
position = 2 mm,0 mm,0 mm
rotation = 0 deg,0 deg,0 deg
name = final_clip
