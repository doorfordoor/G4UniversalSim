# Round 6C boolean geometry parser/backend smoke file.
# Boolean operations are parsed into VolumeNode metadata and subtraction tools
# are applied by VolumeBuilder as G4SubtractionSolid operations.

[world]
shape = box
size = 20 mm,20 mm,20 mm
material = G4_AIR

[volume.Target]
parent = world
shape = box
size = 10 mm,10 mm,2 mm
position = 0 mm,0 mm,0 mm
material = G4_Si
sensitive = true

[volume.Target.boolean.0]
operation = subtraction
shape = tubs
parameters = 0 mm,1 mm,2 mm,0 deg,360 deg
position = 0 mm,0 mm,0 mm
name = Target_center_hole

[volume.Target.boolean.1]
operation = subtraction
shape = box
size = 2 mm,8 mm,3 mm
position = 3 mm,0 mm,0 mm
rotation = 0 deg,0 deg,45 deg
name = Target_rotated_slot
